name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter
        run: flutter --version

      - name: Générer le squelette Android (si absent)
        run: bash tool/bootstrap_android.sh

      - name: Résoudre les dépendances
        run: flutter pub get

      # Non bloquant au premier passage : lancer `dart format .` en local, puis
      # retirer la ligne `continue-on-error` pour rendre ce contrôle bloquant.
      - name: Vérifier le formatage Dart
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos

      - name: Tests unitaires
        run: flutter test

      - name: Compiler l'APK debug
        run: flutter build apk --debug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: AviatorScope-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
