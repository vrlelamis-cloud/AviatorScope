name: aviatorscope
description: Analyse statistique locale des multiplicateurs observés (Aviator) - ANALYSE, STATISTIQUES, ESTIMATIONS.
publish_to: "none"
version: 3.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  fl_chart: ^0.69.2
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.4
  csv: ^6.0.0
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  google_mlkit_text_recognition: ^0.14.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
